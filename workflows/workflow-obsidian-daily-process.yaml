id: 4cf21f38-7b16-42ee-8a65-913630a0c62b
name: obsidian-daily-process
description: "Turn one day's daily-log note into a separate processed note that lists atomic todos and dated permanent notes (one idea each, in full sentences)."
version: 1
tags:
  puddle: "true"

inputs:
  type: object
  properties:
    date:
      type: string
      description: "Day to process, as YYYY-MM-DD. Leave empty for today."
      default: ""
  required: []

jobs:
  - name: main
    description: "Read the day's log, ask the AI through the opencode model, then write the processed note."
    dependsOn: []
    weight: 0
    steps:
      - name: prepare
        description: "Read the daily note and store the request (system prompt, prompt, JSON schema)."
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: obsidian-daily-processor
          methodName: prepare
          inputs:
            date: ${{ inputs.date }}
      - name: ask
        description: "Ask the AI (model instance `opencode`, @mesgme/opencode) for todos and permanent notes."
        dependsOn:
          - step: prepare
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: opencode
          methodName: ask
          inputs:
            system: ${{ data.latest("obsidian-daily-processor", "request").attributes.system }}
            prompt: ${{ data.latest("obsidian-daily-processor", "request").attributes.prompt }}
            schema: ${{ data.latest("obsidian-daily-processor", "request").attributes.schema }}
            name: obsidian-daily-processor
      - name: run
        description: "A note at <outputFolder>/<date> processed.md with the day's todos and permanent notes, plus the number of each."
        dependsOn:
          - step: ask
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: obsidian-daily-processor
          methodName: run
          inputs:
            date: ${{ data.latest("obsidian-daily-processor", "request").attributes.date }}
            answer: ${{ data.latest("opencode", "obsidian-daily-processor").attributes.json }}
